name: Construir y publicar la web

# Regenera TODO el sitio en docs/ (calculadora + reportaje + 52 páginas de
# provincia + sus miniaturas + sitemap + robots + GIFs + og:image) y lo
# commitea. Así no hay que subir nada a mano: editas el script o cambian los
# datos y se reconstruye.

on:
  workflow_dispatch:           # ejecutar a mano desde la pestaña Actions
  push:                        # al cambiar el generador o los datos
    paths:
      - "aemet-temperaturas/scripts/generar_calculadora.py"
      - "aemet-temperaturas/scripts/generar_pagina_mapa.py"
      - "aemet-temperaturas/scripts/generar_miniaturas.py"
      - "aemet-temperaturas/scripts/generar_presskit.py"
      - "aemet-temperaturas/scripts/estudio_colores.py"
      - "aemet-temperaturas/analisis/refugios_nocturnos_ranking.csv"
      - "aemet-temperaturas/datos/spain-provinces.geojson"
  schedule:
    - cron: "0 11 * * *"       # reconstrucción diaria de la web

permissions:
  contents: write

# Comparte cola con los demás workflows que escriben en docs/ (no se solapan).
concurrency:
  group: commit-docs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Pillow y numpy (miniaturas y estudios de mapas)
        run: pip install pillow numpy

      - name: Generar estudios de superposición (La España que nunca se colorea)
        run: python aemet-temperaturas/scripts/estudio_colores.py

      - name: Generar miniaturas de las 52 landings provinciales
        run: python aemet-temperaturas/scripts/generar_miniaturas.py

      - name: Generar web (calculadora + provincias + sitemap + robots)
        run: python aemet-temperaturas/scripts/generar_calculadora.py

      - name: Generar mapa interactivo de estaciones
        run: python aemet-temperaturas/scripts/generar_pagina_mapa.py

      # El dosier de prensa va aquí, y no en un workflow aparte, justamente
      # porque sus cifras se leen de los ficheros de análisis en cada
      # ejecución: así nunca se queda viejo. No necesita pandas —usa csv y
      # statistics— para no engordar esta instalación por cuatro medianas.
      - name: Generar dosier de prensa
        run: python aemet-temperaturas/scripts/generar_presskit.py

      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "Sin cambios en docs/."
          else
            git commit -m "Reconstruir web ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push && exit 0
              echo "push rechazado (colisión con otro workflow), reintento $i…"; sleep 4
            done
            echo "No se pudo empujar tras 5 intentos"; exit 1
          fi
