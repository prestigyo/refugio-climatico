name: Descarga diaria AEMET

on:
  # 10:30 UTC = 12:30 hora peninsular (CEST). AEMET actualiza por la mañana,
  # así que sobre las 12 ya hay datos definitivos del día.
  schedule:
    - cron: "30 10 * * *"
  # Permite lanzar la ejecución manualmente desde la pestaña Actions.
  workflow_dispatch:

# Necesario para que la Action pueda hacer commit & push al propio repo.
permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descargar mapas de AEMET
        run: python scripts/descarga_aemet.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/ metadata.csv
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear."
          else
            FECHA=$(date -u +"%Y-%m-%d")
            git commit -m "Mapas AEMET ${FECHA}"
            git push
          fi
