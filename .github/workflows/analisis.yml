name: Análisis refugios climáticos

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *"   # día 1 de cada mes a las 06:00 UTC

permissions:
  contents: write

jobs:
  analizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r aemet-temperaturas/requirements.txt

      - name: Ejecutar análisis
        working-directory: aemet-temperaturas
        run: python scripts/analisis_refugios.py

      - name: Commit y push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aemet-temperaturas/analisis/
          if ! git diff --cached --quiet; then
            git commit -m "Análisis refugios climáticos $(date -u +%Y-%m-%d)"
            git push
          fi
