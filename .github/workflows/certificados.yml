name: Certificados para ayuntamientos

# Genera las paginas de certificado (una por estacion con <1 noche tropical al
# ano), los 25 diplomas PNG "Refugio Climatico de Espana 2026" y el sello de
# cada pueblo en docs/badges/
# (quedan servidos en nochetropical.es/certificados/...). Solo a mano: es una
# acción puntual, no un proceso periódico.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commit-docs
  cancel-in-progress: false

jobs:
  certificados:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Pillow
        run: pip install pillow

      - name: Generar los certificados
        run: python aemet-temperaturas/scripts/generar_certificados.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # docs/badges tambien: generar_certificados.py escribe ahi el sello
          # de cada pueblo (badges/pueblo-<slug>.svg), que es justo el <img>
          # que el alojamiento se pega en su web. Sin esto se publican las
          # paginas y no los sellos, y el embed sale roto fuera del sitio.
          git add docs/certificados docs/badges
          if git diff --staged --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Certificados Refugio Climático de España 2026"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push && exit 0
              echo "push rechazado (colisión con otro workflow), reintento $i…"; sleep 4
            done
            echo "No se pudo empujar tras 5 intentos"; exit 1
          fi
