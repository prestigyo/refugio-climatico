name: Estudio horario (cuántas horas se duerme)

# Recalcula el estudio de la curva nocturna sobre el archivo horario propio
# (datos/horarias/AAAA/*.csv.gz) y escribe docs/estudios/horas-datos.json, que
# es de donde generar_calculadora.py saca la landing
# /cuantas-horas-se-duerme-en-verano/. Sin ese JSON la landing no se publica.
#
# SEMANAL, no diario. El archivo crece una noche por día: republicar a diario
# movería decimales sin que cambie nada de fondo, y cada rebuild de la web
# reescribe 400 páginas. Los lunes hay siete noches nuevas, que sí cambian algo.
#
# Solo escribe el JSON y los CSV del análisis. La landing la construye el build
# siguiente (construir-web.yml, 11:00 UTC), que ya lee el JSON si existe.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"        # lunes 04:00 UTC, antes del build de las 11:00

permissions:
  contents: write

# GRUPO PROPIO, no el de commit-docs. GitHub solo guarda UNA ejecución en cola
# por grupo de concurrencia: cuando llega otra, la que esperaba se CANCELA, aunque
# cancel-in-progress sea false. Con commit-docs —donde se apilan construir-web,
# los GIFs, el parte y el calendario— este workflow se quedaba en la cola y moría
# sin llegar a arrancar (cero jobs, cancelado a los 21 s). Le pasó el 2026-09-24 y
# dejó la landing sin publicar: sin su JSON, el generador la omite.
# Solaparse no cuesta nada: escribe un fichero que no toca nadie más y el push va
# protegido por el reintento con pull --rebase --autostash de abajo.
concurrency:
  group: estudio-horario
  cancel-in-progress: false

jobs:
  estudio:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # El script es stdlib salvo el PNG, que dibuja con matplotlib si está.
      - name: Instalar matplotlib
        run: pip install matplotlib

      - name: Recalcular el estudio horario
        run: python aemet-temperaturas/scripts/analisis_curva_nocturna.py

      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/estudios/horas-datos.json aemet-temperaturas/analisis
          if git diff --staged --quiet; then
            echo "Sin cambios en el estudio horario."
          else
            git commit -m "Actualizar estudio horario ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push && exit 0
              echo "push rechazado (colisión con otro workflow), reintento $i…"; sleep 4
            done
            echo "No se pudo empujar tras 5 intentos"; exit 1
          fi
