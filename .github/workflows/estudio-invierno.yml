name: Estudio de invierno (las dos caras)

# Recalcula el invierno (analisis_invierno.py) y escribe
# docs/estudios/invierno-datos.json, de donde generar_calculadora.py saca la
# landing /en/best-climate-in-spain-year-round/. Sin ese JSON no hay página.
#
# MENSUAL, y el día 1 a las 08:00. Dos razones para esa hora: analisis.yml corre
# a las 06:00 del día 1 y es quien rehace noches_por_anio.csv, que este análisis
# necesita para cruzar el invierno con el verano; y el build de la web pasa a
# las 11:00, así que la landing se reconstruye el mismo día sin tocar nada.
#
# Mensual y no semanal porque la serie son nueve inviernos: una semana más de
# datos no mueve una mediana de 151 días, y cada rebuild reescribe 400 páginas.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 1 * *"        # día 1 de cada mes, tras analisis.yml

permissions:
  contents: write

# GRUPO PROPIO, no el de commit-docs. GitHub solo guarda UNA ejecución en cola
# por grupo de concurrencia: cuando llega otra, la que esperaba se CANCELA, aunque
# cancel-in-progress sea false. Con commit-docs —donde se apilan construir-web,
# los GIFs, el parte y el calendario— este workflow se quedaba en la cola y moría
# sin llegar a arrancar (cero jobs, cancelado a los 21 s). Le pasó el 2026-09-24 y
# dejó la landing sin publicar: sin su JSON, el generador la omite.
# Solaparse no cuesta nada: escribe un fichero que no toca nadie más y el push va
# protegido por el reintento con pull --rebase --autostash de abajo.
concurrency:
  group: estudio-invierno
  cancel-in-progress: false

jobs:
  invierno:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Solo pandas: el coeficiente de Spearman se calcula con rangos + Pearson
      # a propósito, para no arrastrar scipy por un único número.
      - name: Instalar pandas
        run: pip install pandas

      - name: Recalcular el invierno
        run: python aemet-temperaturas/scripts/analisis_invierno.py

      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # LOS DOS ficheros que escribe el script, no uno. Estaba solo el
          # primero: winter-stations.json se generaba en CI y se tiraba, asi
          # que la herramienta se publicaba sin sus datos y contestaba "the
          # station data could not be loaded" a todo el mundo.
          git add docs/estudios/invierno-datos.json \
                  docs/en/winter-stations.json \
                  aemet-temperaturas/analisis
          if git diff --staged --quiet; then
            echo "Sin cambios en el estudio de invierno."
          else
            git commit -m "Actualizar estudio de invierno ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push && exit 0
              echo "push rechazado (colisión con otro workflow), reintento $i…"; sleep 4
            done
            echo "No se pudo empujar tras 5 intentos"; exit 1
          fi
