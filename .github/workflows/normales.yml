name: Descarga normales 1991-2020

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normales:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r aemet-temperaturas/requirements.txt

      - name: Descargar normales
        working-directory: aemet-temperaturas
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: python scripts/descarga_normales.py

      - name: Commit y push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aemet-temperaturas/datos/normales_1991_2020.csv
          if ! git diff --cached --quiet; then
            git commit -m "Normales climáticos 1991-2020"
            git push
          fi
