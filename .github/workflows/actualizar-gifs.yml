name: Actualizar GIFs de la ola de calor

# Regenera los GIFs animados (máximas, mínimas y doble panel) a partir de los
# mapas diarios que descarga descarga_aemet.py. Se ejecuta tras la descarga
# diaria; commitea solo si los GIFs han cambiado.

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC, después de la descarga diaria (10:30 UTC)
  workflow_dispatch:        # ejecutar a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  gifs:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Pillow
        run: pip install pillow

      - name: Regenerar GIFs
        run: python aemet-temperaturas/scripts/generar_gif.py

      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.gif
          if git diff --staged --quiet; then
            echo "Sin cambios en los GIFs."
          else
            git commit -m "Actualizar GIFs ola de calor ($(date -u +%Y-%m-%d))"
            git push
          fi
