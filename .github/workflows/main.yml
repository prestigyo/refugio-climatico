name: Descarga diaria AEMET

on:
  schedule:
    - cron: "30 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r aemet-temperaturas/requirements.txt

      - name: Descargar mapas de AEMET
        working-directory: aemet-temperaturas
        run: python scripts/descarga_aemet.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aemet-temperaturas/images/ aemet-temperaturas/metadata.csv
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear."
          else
            FECHA=$(date -u +"%Y-%m-%d")
            git commit -m "Mapas AEMET ${FECHA}"
            git push
          fi
