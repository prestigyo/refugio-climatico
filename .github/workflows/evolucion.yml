name: Evolución de una estación

on:
  workflow_dispatch:
    inputs:
      buscar:
        description: "Nombre o indicativo de la estación (ej: MOSQUERUELA, CEDRILLAS, 8486X)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  evolucion:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r aemet-temperaturas/requirements.txt

      - name: Analizar estación
        working-directory: aemet-temperaturas
        run: python scripts/evolucion_estacion.py --buscar "${{ inputs.buscar }}"

      - name: Commit y push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aemet-temperaturas/analisis/estaciones/
          if ! git diff --cached --quiet; then
            git commit -m "Evolución estación: ${{ inputs.buscar }}"
            git push
          fi
