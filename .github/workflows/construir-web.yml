name: Construir y publicar la web

# Regenera TODO el sitio en docs/ (calculadora + reportaje + 52 páginas de
# provincia + sitemap + robots + GIFs + og:image) y lo commitea. Así no hay
# que subir nada a mano: editas el script o cambian los datos y se reconstruye.

on:
  workflow_dispatch:           # ejecutar a mano desde la pestaña Actions
  push:                        # al cambiar el generador o los datos
    paths:
      - "aemet-temperaturas/scripts/generar_calculadora.py"
      - "aemet-temperaturas/scripts/generar_pagina_mapa.py"
      - "aemet-temperaturas/scripts/generar_gif.py"
      - "aemet-temperaturas/analisis/refugios_nocturnos_ranking.csv"
      - "aemet-temperaturas/datos/spain-provinces.geojson"
  schedule:
    - cron: "0 11 * * *"       # refresco diario de los GIFs (tras la descarga de mapas)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Pillow (para GIFs y og:image)
        run: pip install pillow

      - name: Generar GIFs y og:image
        run: python aemet-temperaturas/scripts/generar_gif.py

      - name: Generar web (calculadora + provincias + sitemap + robots)
        run: python aemet-temperaturas/scripts/generar_calculadora.py

      - name: Generar mapa interactivo de estaciones
        run: python aemet-temperaturas/scripts/generar_pagina_mapa.py

      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "Sin cambios en docs/."
          else
            git commit -m "Reconstruir web ($(date -u +%Y-%m-%d))"
            git push
          fi
