name: El parte de la noche

# Cada mañana: lee la observación en tiempo real de AEMET (últimas 24 h) y
# publica docs/parte/ (página + texto listo para tuitear). Es el arma diaria:
# los datos de ANOCHE, sin el retraso de 3-5 días de los climatológicos.

on:
  workflow_dispatch:
  schedule:
    - cron: "15 7 * * *"       # 07:15 UTC = 09:15 hora peninsular en verano
    - cron: "50 8 * * *"       # red de seguridad: GitHub a veces se salta un cron.
                               # Si el primero ya publicó, este no duplica nada
                               # (candado de publicar_x.py + upsert del histórico).

permissions:
  contents: write

# Un solo run a la vez de este workflow (los que se solapan se encolan).
concurrency:
  group: commit-docs
  cancel-in-progress: false

jobs:
  parte:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar requests y tweepy
        run: pip install requests tweepy

      - name: Generar el parte de la noche
        working-directory: aemet-temperaturas/scripts
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: python parte_nocturno.py

      - name: Publicar en X (@nochetropicales)
        working-directory: aemet-temperaturas/scripts
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python publicar_x.py
        continue-on-error: true

      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # docs/parte es la publicación; datos/horarias es el archivo de
          # lecturas horarias, que hay que commitear o el runner se lo lleva.
          git add docs/parte aemet-temperaturas/datos/horarias
          if git diff --staged --quiet; then
            echo "Sin cambios en docs/parte/ ni en datos/horarias/."
          else
            git commit -m "El parte de la noche ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push && exit 0
              echo "push rechazado (colisión con otro workflow), reintento $i…"; sleep 4
            done
            echo "No se pudo empujar tras 5 intentos"; exit 1
          fi
